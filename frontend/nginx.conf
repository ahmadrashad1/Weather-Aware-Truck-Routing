server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Browsers refuse a module worker unless it is served as JavaScript, and nginx's default
  # types don't cover .mjs. MapLibre's worker needs this, or the map never draws.
  location ~ \.mjs$ {
    types { }
    default_type text/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
