name: Deploy

# Publishes images once CI passes on main, then deploys them through GitHub OIDC. The job gets
# short-lived AWS credentials, so GitHub stores no AWS keys. See docs/deployment.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time, in order.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    # The AWS role trusts this environment only, and the environment only allows main.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGES: ghcr.io/ahmadrashad1/weather-aware-truck-routing
      INSTANCE: truck-routing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGES }}/backend:${{ env.REVISION }}
          build-args: APP_VERSION=${{ env.REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Publish the frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGES }}/frontend:${{ env.REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # Moved last, so the server can never see a revision with only one image published.
      - name: Release to production
        run: |
          for image in backend frontend; do
            docker buildx imagetools create \
              --tag "$IMAGES/$image:production" "$IMAGES/$image:$REVISION"
          done
      - name: Sign in to AWS through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ap-southeast-2
      - name: Open SSH to this runner only
        run: |
          runner_ip="$(curl -fsS --max-time 10 https://checkip.amazonaws.com)"
          echo "::add-mask::$runner_ip"
          echo "RUNNER_IP=$runner_ip" >> "$GITHUB_ENV"
          aws lightsail open-instance-public-ports --instance-name "$INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=tcp,cidrs=$runner_ip/32"
      - name: Deploy on the server
        timeout-minutes: 12
        env:
          SERVER_KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
        run: |
          # A failed or rolled-back update makes this step fail.
          if ! bash deploy/run-on-server.sh sudo systemctl start truck-routing-update.service; then
            bash deploy/run-on-server.sh sudo journalctl -u truck-routing-update --no-pager -n 40 -o cat || true
            echo "::error::The update failed on the server, so it rolled back. See docs/deployment.md."
            exit 1
          fi
          bash deploy/run-on-server.sh sudo journalctl -u truck-routing-update --no-pager -n 3 -o cat
      - name: Close SSH
        if: always() && env.RUNNER_IP != ''
        run: |
          aws lightsail close-instance-public-ports --instance-name "$INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=tcp,cidrs=$RUNNER_IP/32"
      - name: Confirm the public site runs this revision
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "$PRODUCTION_URL/api/v1/health" | grep -q "\"version\": \"$REVISION\""; then
              echo "The public site is running $REVISION"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The public site isn't reporting $REVISION."
          exit 1
