name: Deploy

# Publishes images once CI passes on main. The server notices the new `production` tag and updates
# itself, so GitHub holds no AWS credentials or SSH keys. See docs/deployment.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time, in order.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGES: ghcr.io/ahmadrashad1/weather-aware-truck-routing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGES }}/backend:${{ env.REVISION }}
          build-args: APP_VERSION=${{ env.REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Publish the frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGES }}/frontend:${{ env.REVISION }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # Moved last, so the server can never see a revision with only one image published.
      - name: Release to production
        run: |
          for image in backend frontend; do
            docker buildx imagetools create \
              --tag "$IMAGES/$image:production" "$IMAGES/$image:$REVISION"
          done
      - name: Wait for the server to run this revision
        if: vars.PRODUCTION_URL != ''
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 10 "$PRODUCTION_URL/api/v1/health" | grep -q "\"version\": \"$REVISION\""; then
              echo "The server is running $REVISION"
              exit 0
            fi
            sleep 15
          done
          echo "::error::The server didn't start $REVISION within 10 minutes, so it either failed and rolled back or isn't updating. See docs/deployment.md."
          exit 1
