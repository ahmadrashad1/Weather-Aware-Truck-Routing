name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
        env:
          DJANGO_DEBUG: "true" # django-stubs imports settings; no secret needed in DEBUG
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Check the API schema is current
        run: |
          uv run python manage.py spectacular --validate --fail-on-warn --file "$RUNNER_TEMP/schema.yml"
          diff schema.yml "$RUNNER_TEMP/schema.yml"
        env:
          DJANGO_DEBUG: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check the generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    env:
      # Enough to start the stack. CI never calls the real providers.
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-the-deployment-checks
      TOMTOM_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Check the deployment scripts
        run: |
          shellcheck --shell=sh deploy/bootstrap.sh
          shellcheck --shell=bash deploy/update.sh deploy/run-on-server.sh deploy/aws/alarms.sh
      - name: Start the full stack
        run: docker compose up --build --detach --wait
      - name: Check the frontend reaches the API
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/health | grep '"status": "ok"'
      - name: Check the map worker is served as JavaScript
        run: |
          worker=$(docker compose exec -T frontend sh -c 'ls /usr/share/nginx/html/assets | grep maplibre-gl-worker')
          curl -fsSI "http://127.0.0.1:8080/assets/$worker" | grep -i '^content-type: text/javascript'
      - name: Check assets are compressed
        run: |
          script=$(curl -fsS http://127.0.0.1:8080/ | grep -o 'assets/[^"]*\.js' | head -1)
          curl -fsSI -H 'Accept-Encoding: gzip' "http://127.0.0.1:8080/$script" | grep -i '^content-encoding: gzip'
          # In production Caddy adds a Via header, and nginx skips compression for those by default.
          curl -fsSI -H 'Accept-Encoding: gzip' -H 'Via: 1.1 Caddy' "http://127.0.0.1:8080/$script" | grep -i '^content-encoding: gzip'
      - name: Show logs after a failure
        if: failure()
        run: docker compose logs

  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check commit signatures, author and attribution
        run: |
          failed=0
          shas=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].sha')
          if [ -z "$shas" ]; then
            echo "::error::No commits found for PR $PR"; exit 1
          fi
          for sha in $shas; do
            commit=$(gh api "repos/$REPO/commits/$sha")
            verified=$(jq -r '.commit.verification.verified' <<<"$commit")
            login=$(jq -r '.author.login // ""' <<<"$commit")
            message=$(jq -r '.commit.message' <<<"$commit")
            if [ "$verified" != "true" ]; then
              echo "::error::$sha is not verified"; failed=1
            fi
            if [ "$login" != "ahmadrashad1" ]; then
              echo "::error::$sha author is '$login', expected ahmadrashad1"; failed=1
            fi
            if grep -Eiq 'co-authored-by:.*(claude|anthropic)|generated with.*claude' <<<"$message"; then
              echo "::error::$sha message has Claude/Anthropic attribution"; failed=1
            fi
          done
          exit $failed
