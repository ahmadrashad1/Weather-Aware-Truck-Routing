name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
        env:
          DJANGO_DEBUG: "true" # django-stubs imports settings; no secret needed in DEBUG
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Check the API schema is current
        run: |
          uv run python manage.py spectacular --validate --fail-on-warn --file "$RUNNER_TEMP/schema.yml"
          diff schema.yml "$RUNNER_TEMP/schema.yml"
        env:
          DJANGO_DEBUG: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false

  commit-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check commit signatures, author and attribution
        run: |
          failed=0
          shas=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].sha')
          if [ -z "$shas" ]; then
            echo "::error::No commits found for PR $PR"; exit 1
          fi
          for sha in $shas; do
            commit=$(gh api "repos/$REPO/commits/$sha")
            verified=$(jq -r '.commit.verification.verified' <<<"$commit")
            login=$(jq -r '.author.login // ""' <<<"$commit")
            message=$(jq -r '.commit.message' <<<"$commit")
            if [ "$verified" != "true" ]; then
              echo "::error::$sha is not verified"; failed=1
            fi
            if [ "$login" != "ahmadrashad1" ]; then
              echo "::error::$sha author is '$login', expected ahmadrashad1"; failed=1
            fi
            if grep -Eiq 'co-authored-by:.*(claude|anthropic)|generated with.*claude' <<<"$message"; then
              echo "::error::$sha message has Claude/Anthropic attribution"; failed=1
            fi
          done
          exit $failed
