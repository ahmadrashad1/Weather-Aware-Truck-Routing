name: Live smoke test

# Runs the real app against real providers, so it spends their quota. Manual runs only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "true"
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        run: |
          uv sync --frozen
          nohup uv run python manage.py runserver 127.0.0.1:8000 --noreload &
          curl -fsS --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/api/v1/health
      - name: Install the browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Plan a real trip
        working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_LIVE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
